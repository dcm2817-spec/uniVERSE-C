<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — uniVERSE</title>
<meta name="description" content="Create your uniVERSE account.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="wordmark" aria-label="uniVERSE home">
    <span class="u">u</span><span class="n">n</span><span class="i">i</span><span class="v-cap">V</span><span class="rest">erse</span>
  </a>
  <nav class="header-actions">
    <span class="auth-hint">Already have an account? <a href="login.html">Log in</a></span>
  </nav>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Join students already using uniVERSE to learn, gist, and connect.</p>

    <form class="auth-form" id="register-form" novalidate>
      <label class="field">
        <span class="field-label">Full name</span>
        <input type="text" id="fullname" name="fullname" placeholder="e.g. Marvellous Udoko" required autocomplete="name">
        <span class="field-error" id="fullname-error"></span>
      </label>

      <label class="field">
        <span class="field-label">School</span>
        <div class="combobox" id="school-combobox">
          <input
            type="text"
            id="school-search"
            class="combobox-input"
            placeholder="Search your school..."
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="school-listbox"
            aria-autocomplete="list"
          >
          <input type="hidden" name="school" id="school-value" required>
          <ul class="combobox-list" id="school-listbox" role="listbox" hidden></ul>
        </div>
        <span class="field-error" id="school-error"></span>
      </label>

      <label class="field">
        <span class="field-label">Phone number</span>
        <input type="tel" id="phone" name="phone" placeholder="08xxxxxxxxx" required autocomplete="tel" inputmode="numeric">
        <span class="field-error" id="phone-error"></span>
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        <span class="field-error" id="email-error"></span>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8">
        <span class="field-error" id="password-error"></span>
      </label>

      <label class="field">
        <span class="field-label">Confirm password</span>
        <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter your password" required autocomplete="new-password" minlength="8">
        <span class="field-hint" id="confirm-password-hint"></span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <p class="auth-footnote">By registering, you agree to uniVERSE's Terms and Privacy Policy.</p>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-box">
    <div class="footer-meta">
      <div class="footer-copyright">Copyright &copy; 2027 uniVERSE. All Rights Reserved.</div>
      08xxxxxxxxx<br>09xxxxxxxxx
    </div>
    <div class="footer-social">
      <a href="#" target="_blank" rel="noopener">Facebook</a>
      <a href="#" target="_blank" rel="noopener">Instagram</a>
      <a href="#" target="_blank" rel="noopener">Discord</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="universities.js"></script>
<script src="school-combobox.js"></script>
<script src="register-form.js"></script>
</body>
</html>
