<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — uniVERSE</title>
<meta name="description" content="Log in to your uniVERSE account.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="wordmark" aria-label="uniVERSE home">
    <span class="u">u</span><span class="n">n</span><span class="i">i</span><span class="v-cap">V</span><span class="rest">erse</span>
  </a>
  <nav class="header-actions">
    <span class="auth-hint">New here? <a href="register.html">Register</a></span>
  </nav>
</header>

<main class="auth-wrap">
  <section class="auth-card">
    <h1 class="auth-title">Log in</h1>
    <p class="auth-sub">Pick up where you left off.</p>

    <form class="auth-form" id="login-form" novalidate>
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        <span class="field-error" id="email-error"></span>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        <span class="field-error" id="password-error"></span>
      </label>

      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-box">
    <div class="footer-meta">
      <div class="footer-copyright">Copyright &copy; 2026 uniVERSE. All Rights Reserved.</div>
      0808 473 4611<br>0915 741 0355
    </div>
    <div class="footer-social">
      <a href="https://www.facebook.com/share/1PFbLoDEQh/" target="_blank" rel="noopener">Facebook</a>
      <a href="https://discord.gg/kX32RCdds" target="_blank" rel="noopener">Discord</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="login-form.js"></script>
</body>
</html>
